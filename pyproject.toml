[project]
name = "canvas-copilot"
version = "0.1.0"
description = "A local-first AI assistant for Canvas LMS that answers course-logistics questions."
readme = "README.md"
authors = [
    { name = "Riya Sri Rallabandi", email = "rallabar@uci.edu" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
canvas-copilot = "canvas_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
