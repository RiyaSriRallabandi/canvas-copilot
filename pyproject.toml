[project]
name = "canvas-copilot"
version = "0.1.0"
description = "A local-first AI assistant for Canvas LMS that answers course-logistics questions."
readme = "README.md"
authors = [
    { name = "Riya Sri Rallabandi", email = "rallabar@uci.edu" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "platformdirs>=4.11.7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.2",
]

[project.scripts]
canvas-copilot = "canvas_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Canvas API; needs a stored token; run with --run-live",
]
